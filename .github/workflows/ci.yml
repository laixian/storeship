name: ci
on: [push, pull_request]
jobs:
  test:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 9 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - run: node dist/cli.js --help
      # The generated reference, and the generated blocks inside the skills and
      # the agent docs, are part of the interface: a drift here is a bug.
      - run: node dist/cli.js docs --check docs/commands.md
      - run: node dist/cli.js docs --lang zh --check docs/zh/commands.md
      - run: node dist/cli.js skill sync --check
      - run: node dist/cli.js skill check
      # The published shape has to answer the agent contract, not just start.
      - run: node dist/cli.js spec --json > /dev/null
